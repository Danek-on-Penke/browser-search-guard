<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M 64 12 
           C 85 12, 108 22, 108 22
           C 108 65, 96 95, 64 116
           C 32 95, 20 65, 20 22
           C 20 22, 43 12, 64 12 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linejoin="round" />
  
  <!-- Inner Shield Accent -->
  <path d="M 64 24 
           C 78 24, 96 31, 96 31
           C 96 64, 86 87, 64 104
           C 42 87, 32 64, 32 31
           C 32 31, 50 24, 64 24 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.25)" 
        stroke-width="1.8" />

  <!-- Magnifying Glass with Checkmark -->
  <circle cx="58" cy="54" r="16" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
  <line x1="70" y1="66" x2="84" y2="80" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

  <!-- Checkmark inside lens -->
  <path d="M 50 54 L 56 60 L 67 48" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

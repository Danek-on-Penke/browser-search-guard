<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SearchGuard — Запрос заблокирован</title>
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #1E293B;
      --border: #334155;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --danger: #EF4444;
      --accent: #2563EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 36px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px auto;
      background: rgba(239, 68, 68, 0.15);
      border: 2px solid rgba(239, 68, 68, 0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #F1F5F9;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge-info {
      display: inline-block;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.3);
      color: #60A5FA;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: #1D4ED8; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
      color: var(--text-main);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">🛡️</div>
    <div class="badge-info">Сетевой экран: declarativeNetRequest</div>
    <h1>Поисковый запрос заблокирован</h1>
    <p>
      Запрос содержит маркеры взрослого (18+) или нежелательного контента.
      SearchGuard заблокировал переход к выдаче для предотвращения exposure к порнографическим материалам.
    </p>
    <div class="actions">
      <button type="button" id="backBtn" class="btn btn-secondary">Вернуться назад</button>
      <button type="button" id="optionsBtn" class="btn btn-primary">Настройки SearchGuard</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
